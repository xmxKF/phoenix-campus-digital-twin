c="../renders/roof.png" alt="V1 屋顶"><figcaption>V1 屋顶</figcaption></figure><figure><img src="../renders/v2/roof.png" alt="V2 屋顶"><figcaption>V2 屋顶</figcaption></figure></div><h2>原始设计依据</h2><div class="grid"><figure><img src="../厂区坐北朝南望.jpg" alt="北望南原图"><figcaption>原图 R1</figcaption></figure><figure><img src="../厂区坐南朝北望.jpg" alt="南望北原图"><figcaption>原图 R2</figcaption></figure></div><p>凤凰山位于南侧。地形、周边建筑、设备流程与尺寸是概念重构，尚无实测依据；本次不是施工模型。餐厅按东西方位命名，避免继承两张 AI 图片互换的标签。</p></html>
